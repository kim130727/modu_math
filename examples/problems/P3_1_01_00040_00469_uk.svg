  <text id="slot.question.text" x="20" y="44" fill="#202124" font-family="&quot;Noto Sans&quot;, &quot;Arial&quot;, sans-serif" font-size="26" max_width="860" data-slot-kind="text_box" data-box-x="20" data-box-y="18" data-box-width="860" data-box-height="114" data-line-height="1.35" xml:space="preserve" text-anchor="start" data-raw-text="Минулої неділі родини Санхьона та Йонджіна поїхали на заміську ферму. Родина Санхьона зібрала 259 бататів, а родина Йонджіна —
248 бататів. Скільки всього бататів зібрали обидві родини?">
    <tspan x="20" y="44">Минулої неділі родини Санхьона та</tspan>
    <tspan x="20" y="79.1">Йонджіна поїхали на заміську ферму.</tspan>
    <tspan x="20" y="114.2">Родина Санхьона зібрала 259 бататів, а</tspan>
    <tspan x="20" y="149.3">родина Йонджіна —</tspan>
    <tspan x="20" y="184.4">248 бататів. Скільки всього бататів</tspan>
    <tspan x="20" y="219.5">зібрали обидві родини?</tspan>
  </text>
