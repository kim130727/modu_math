  <rect x="0" y="0" width="900" height="320" fill="#FFFFFF" />
  <text id="slot.question.text" x="44.77" y="81.97399999999999" fill="#202124" font-family="Noto Sans KR" font-size="24" max_width="804" data-slot-kind="text_box" data-box-x="44.77" data-box-y="57.974" data-box-width="804" data-box-height="188" data-line-height="1.5" xml:space="preserve" text-anchor="start" data-raw-text="집에서 학교로 가는 길은 소방서를 거쳐 가는 것과 주민센터를 거쳐서 가는 것 두 가지입니다. 집에서 소방서까지 168m이고 소방서에서 학교까지는 726m입니다. 그리고 집에서 주민센터까지는 625m이고 주민센터에서 학교까지의 거리는 186m입니다. 소방서를 거쳐서 가는 것과 주민센터를 거쳐서 가는 것 중 어느 곳을 거쳐서 가는 것이 더 멀겠습니까?">
    <tspan x="44.77" y="81.97399999999999">집에서 학교로 가는 길은 소방서를 거쳐 가는 것과 주민센터를 거쳐서 가는 것</tspan>
    <tspan x="44.77" y="117.97399999999999">두 가지입니다. 집에서 소방서까지 168m이고 소방서에서 학교까지는</tspan>
    <tspan x="44.77" y="153.974">726m입니다. 그리고 집에서 주민센터까지는 625m이고 주민센터에서</tspan>
    <tspan x="44.77" y="189.974">학교까지의 거리는 186m입니다. 소방서를 거쳐서 가는 것과 주민센터를 거쳐서</tspan>
    <tspan x="44.77" y="225.974">가는 것 중 어느 곳을 거쳐서 가는 것이 더 멀겠습니까?</tspan>
  </text>
