  <text id="slot.question.text" x="37.211" y="52.106" fill="#111827" font-family="&quot;Poor Story&quot;, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="29" max_width="717.416" data-slot-kind="text_box" data-box-x="37.211" data-box-y="23.106" data-box-width="717.416" data-box-height="158" data-line-height="1.25" xml:space="preserve" text-anchor="start" data-raw-text="Накресліть коло за допомогою канцелярської кнопки та паперової смужки. Виберіть позначення отвору, у який слід вставити олівець, щоб накреслити найбільше коло.">
