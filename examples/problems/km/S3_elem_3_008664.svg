  <text id="slot.question.text" x="37.211" y="48.106" fill="#111827" font-family="&quot;Noto Sans KR&quot;, &quot;Pretendard&quot;, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="25" max_width="717.416" data-slot-kind="text_box" data-box-x="37.211" data-box-y="23.106" data-box-width="717.416" data-box-height="158" data-line-height="1.5" data-semantic-role="question" xml:space="preserve" style="white-space: pre" text-anchor="start" data-raw-text="យើងនឹងគូររង្វង់ដោយប្រើម្ជុលចុច និងបន្ទះក្រដាស។ ដើម្បីគូររង្វង់ធំបំផុត សូមជ្រើសនិមិត្តសញ្ញារបស់រន្ធដែលត្រូវដាក់ខ្មៅដៃ។"><tspan x="37.211" y="48.106">យើងនឹងគូររង្វង់ដោយប្រើម្ជុលចុច និងបន្ទះក្រដាស។ </tspan><tspan x="37.211" y="85.606">ដើម្បីគូររង្វង់ធំបំផុត </tspan><tspan x="37.211" y="123.106">សូមជ្រើសនិមិត្តសញ្ញារបស់រន្ធដែលត្រូវដាក់ខ្មៅដៃ។</tspan></text>
