server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deny direct access to any authored DSLs or answer artifact formats
    location ~* \.(dsl\.py|semantic\.json|solvable\.json|renderer\.json|layout\.json)$ {
        deny all;
        return 404;
    }

    # Deny direct access to legacy generated problem directories if present
    location ^~ /assets/generated/ {
        deny all;
        return 404;
    }

    location /api/ {
        # Resolve Docker's service name on requests so backend restarts do not
        # prevent the student frontend from starting or leave a stale address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://web:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the same student bundle path used by the Konva preview.
    location /static/editor_next/student_app/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
