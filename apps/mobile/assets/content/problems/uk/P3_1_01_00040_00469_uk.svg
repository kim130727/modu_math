  <text id="slot.question.text" x="48" y="54" fill="#202124" font-family="&quot;Noto Sans&quot;, sans-serif" font-size="24" max_width="804" data-slot-kind="text_box" data-box-x="48" data-box-y="30" data-box-width="804" data-box-height="215" data-line-height="1.55" xml:space="preserve" text-anchor="start" data-raw-text="Подивіться на малюнок. Родини Санхьона і Йонджіна на вихідних пішли на поле. Родина Санхьона зібрала 259 бататів, а родина Йонджіна зібрала 248 бататів. Скільки бататів зібрали обидві родини разом?">
    <tspan x="48" y="54">Подивіться на малюнок. Родини Санхьона</tspan>
    <tspan x="48" y="91.2">і Йонджіна на вихідних пішли на поле.</tspan>
    <tspan x="48" y="128.4">Родина Санхьона зібрала 259 бататів, а</tspan>
    <tspan x="48" y="165.60000000000002">родина Йонджіна зібрала 248 бататів.</tspan>
    <tspan x="48" y="202.8">Скільки бататів зібрали обидві родини</tspan>
    <tspan x="48" y="240">разом?</tspan>
  </text>
