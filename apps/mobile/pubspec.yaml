name: modu_math_app
description: A local Flutter MVP for solving Modu Math SVG/JSON problems.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.5
  google_fonts: ^6.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/characters/
    - examples/problems/
    - examples/problems/ko/
    - examples/problems/ko/3-1/1_덧셈과_뺄셈/
    - examples/problems/ko/3-1/2_평면도형/
    - examples/problems/ko/3-1/3_나눗셈/
    - examples/problems/ko/3-1/4_곱셈/
    - examples/problems/ko/3-1/5_길이와_시간/
    - examples/problems/ko/3-1/6_분수와_소수/
    - examples/problems/ko/3-2/1_곱셈/
    - examples/problems/ko/3-2/2_나눗셈/
    - examples/problems/ko/3-2/3_원/
    - examples/problems/ko/3-2/4_분수/
    - examples/problems/ko/3-2/5_들이와_무게/
    - examples/problems/ko/3-2/6_자료의_정리/


