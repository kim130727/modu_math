name: modu_math_app
description: A local Flutter MVP for solving Modu Math SVG/JSON problems.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.5
  google_fonts: ^6.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/characters/
    - generated/examples/problems/
    - generated/examples/problems/ko/
    - generated/examples/problems/ko/day_01/
    - generated/examples/problems/ko/day_02/
    - generated/examples/problems/ko/day_03/
    - generated/examples/problems/ko/day_04/
    - generated/examples/problems/ko/day_05/
    - generated/examples/problems/ko/day_06/
    - generated/examples/problems/ko/day_07/
    - generated/examples/problems/ko/day_08/
    - generated/examples/problems/ko/day_09/
    - generated/examples/problems/ko/day_10/
    - generated/examples/problems/ko/day_11/
    - generated/examples/problems/ko/day_12/
    - generated/examples/problems/ko/day_13/
    - generated/examples/problems/ko/day_14/
    - generated/examples/problems/ko/day_15/
    - generated/examples/problems/ko/day_16/
    - generated/examples/problems/ko/day_17/
    - generated/examples/problems/ko/day_18/
    - generated/examples/problems/ko/day_19/
    - generated/examples/problems/uk/




